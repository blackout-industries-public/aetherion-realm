[project]
name = "ai-bridge"
version = "0.1.0"
description = "Game-to-LLM adapter for the Aetherion realm"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
]

[tool.uv]
package = false

# src is not an installable package (package = false; the Dockerfile runs it via
# PYTHONPATH=/app/src instead) - pytest needs the same path added so `import bridge`
# resolves under `uv run` without installing anything.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

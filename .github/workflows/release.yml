name: release

# Tag-driven releases: push a tag like v0.2.0 and this builds the changelog
# from every commit since the previous tag and publishes a GitHub Release.
# Commits here are descriptive by convention (see the repo history), so their
# subjects ARE the changelog; bodies are preserved in a collapsible section.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the previous tag and the commit range resolve.
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            COMPARE="**Full diff**: [\`${PREV}...${TAG}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG})"
          else
            RANGE="${TAG}"
            COMPARE=""
          fi

          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$RANGE"
            echo
            echo "<details><summary>Commit details</summary>"
            echo
            git log --no-merges --format='### %s%n%n%b' "$RANGE"
            echo "</details>"
            echo
            echo "$COMPARE"
          } > RELEASE_NOTES.md

          echo "notes_file=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}"

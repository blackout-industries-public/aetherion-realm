name: build-worldserver

# The full compile: pinned core + module + the entire patch chain, built the
# same way deploys build it. Manual dispatch ONLY - a cold AzerothCore build
# on a hosted 2-core runner burns hours of minutes, so the routine gate is
# the unit + patch-chain suite in validate.yml; compile errors surface at
# deploy time on the server's warm ccache instead.

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned core and modules
        run: |
          set -euo pipefail
          source overlay/.env.example
          git clone --quiet --branch "$AC_BRANCH" "$AC_REPO" /tmp/ac
          git -C /tmp/ac checkout --quiet --detach "$AC_COMMIT"
          git clone --quiet "$PLAYERBOTS_REPO" /tmp/ac/modules/mod-playerbots
          git -C /tmp/ac/modules/mod-playerbots checkout --quiet --detach "$PLAYERBOTS_COMMIT"
          git clone --quiet "$AHBOT_REPO" /tmp/ac/modules/mod-ah-bot
          git -C /tmp/ac/modules/mod-ah-bot checkout --quiet --detach "$AHBOT_COMMIT"

      - name: Apply patch chain
        run: patches/llm/apply.sh /tmp/ac/modules/mod-playerbots

      - name: Compile worldserver image
        working-directory: /tmp/ac
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/overlay/docker-compose.override.yml" docker-compose.override.yml
          cp "$GITHUB_WORKSPACE/overlay/.env.example" .env
          docker compose build ac-worldserver

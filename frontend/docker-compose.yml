# Read-only dashboard. Its own stack: it must never be able to affect the realm, and
# it should be restartable without touching anything else.
services:
  warcraft-map:
    container_name: warcraft-map
    build: .
    restart: unless-stopped
    environment:
      # NUXT_ prefix is required: runtimeConfig defaults are evaluated at BUILD time,
      # and only NUXT_<KEY> env vars override them at runtime. Passing DB_PASSWORD
      # directly silently baked in an empty password.
      NUXT_DB_HOST: ac-database
      NUXT_DB_PORT: "3306"
      NUXT_DB_USER: root
      NUXT_DB_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD}
    ports:
      # LAN-visible on purpose - this is the one thing meant to be opened in a browser.
      - "3000:3000"
    volumes:
      # Bind-mounted so continent art can be added without rebuilding the image.
      - ./maps:/app/maps:ro
    networks:
      - ac-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ac-network:
    external: true
    name: azerothcore_ac-network
